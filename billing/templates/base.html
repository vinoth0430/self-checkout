<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Self Checkout{% endblock %}</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #f4f6f8;
            color: #1a1a2e;
            min-height: 100vh;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            padding: 40px 20px;
        }
        .container {
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 640px;
            padding: 32px;
        }
        h1 { font-size: 26px; margin-bottom: 20px; color: #0f172a; }
        h2 { font-size: 20px; margin: 20px 0 10px; color: #0f172a; }
        h3 { font-size: 16px; font-weight: 500; color: #475569; margin: 6px 0; }
        input[type="text"], input[type="email"] {
            width: 100%;
            padding: 14px 16px;
            font-size: 16px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            outline: none;
            transition: border-color 0.2s;
        }
        input[type="text"]:focus, input[type="email"]:focus { border-color: #3b82f6; }
        table {
            width: 100%;
            border-collapse: collapse;
            margin: 16px 0;
        }
        th, td {
            text-align: left;
            padding: 12px;
            border-bottom: 1px solid #e2e8f0;
        }
        th { color: #64748b; font-size: 13px; text-transform: uppercase; letter-spacing: 0.5px; }
        .grand-total {
            font-size: 24px;
            font-weight: 700;
            color: #0f172a;
            padding: 16px 0;
            border-top: 2px solid #0f172a;
            margin-top: 8px;
        }
        button {
            width: 100%;
            padding: 16px;
            font-size: 16px;
            font-weight: 600;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            margin-top: 12px;
            transition: opacity 0.2s;
        }
        button:hover { opacity: 0.9; }
        .btn-primary { background: #16a34a; color: #fff; }
        .btn-secondary { background: #f1f5f9; color: #475569; }
        .error-msg {
            background: #fef2f2;
            color: #dc2626;
            padding: 12px 16px;
            border-radius: 8px;
            margin: 12px 0;
            font-size: 14px;
        }
        .success-icon {
            width: 64px; height: 64px;
            background: #16a34a;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            color: #fff; font-size: 32px;
            margin: 0 auto 16px;
        }
        .center { text-align: center; }
        a { color: #3b82f6; text-decoration: none; }
    </style>
</head>
<body>
    <div class="container">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
