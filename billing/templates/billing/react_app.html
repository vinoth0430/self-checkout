<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Self Checkout</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<style>
  :root {
    --ink: #151B3D;
    --chili: #E8552C;
    --paper: #FAFAF8;
    --slate: #6B7280;
    --mint: #2A9D8F;
    --line: #E4E1D8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
  }
  body {
    font-family: 'Space Grotesk', sans-serif;
    background: linear-gradient(180deg, #1B2147 0%, #151B3D 100%);
    color: var(--ink);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 48px 20px;
  }
  .kiosk {
    width: 100%;
    max-width: 460px;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    color: #F5F4EF;
    margin-bottom: 18px;
    padding-left: 4px;
  }
  .brand .mark {
    width: 30px; height: 30px;
    background: var(--chili);
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 15px; color: #fff;
  }
  .brand .name { font-weight: 600; font-size: 15px; letter-spacing: 0.2px; }
  .brand .tag { font-size: 12px; color: #9BA1C4; margin-left: auto; }

  .card {
    background: var(--paper);
    border-radius: 18px;
    box-shadow: 0 24px 60px rgba(0,0,0,0.35);
    overflow: hidden;
  }

  /* --- Scan zone --- */
  .scan-zone {
    padding: 26px 26px 20px;
    border-bottom: 1px dashed var(--line);
  }
  .scan-label {
    font-size: 11px; font-weight: 600; letter-spacing: 1.2px;
    text-transform: uppercase; color: var(--slate); margin-bottom: 10px;
  }
  .scan-input-wrap { position: relative; }
  .scan-input-wrap input {
    width: 100%;
    font-family: 'JetBrains Mono', monospace;
    font-size: 17px;
    padding: 15px 16px;
    border: 2px solid var(--ink);
    border-radius: 10px;
    outline: none;
    background: #fff;
    color: var(--ink);
    letter-spacing: 0.5px;
  }
  .scan-input-wrap input::placeholder { color: #B7BAC9; font-family: 'Space Grotesk', sans-serif; }
  .scan-input-wrap input:focus { border-color: var(--chili); }
  .scan-line {
    position: absolute; left: 8px; right: 8px; top: 0;
    height: 2px; background: var(--chili);
    opacity: 0; pointer-events: none;
    box-shadow: 0 0 8px 1px rgba(232,85,44,0.6);
  }
  .scan-input-wrap input:focus ~ .scan-line {
    animation: sweep 1.6s ease-in-out infinite;
  }
  @keyframes sweep {
    0% { top: 6px; opacity: 0.9; }
    50% { top: calc(100% - 8px); opacity: 0.9; }
    51% { opacity: 0; }
    100% { top: 6px; opacity: 0; }
  }

  /* --- Receipt --- */
  .receipt { padding: 22px 26px 10px; }
  .receipt-title {
    font-size: 12px; font-weight: 600; letter-spacing: 1.2px;
    text-transform: uppercase; color: var(--slate); margin-bottom: 14px;
  }
  .item-row {
    display: grid;
    grid-template-columns: 1fr auto auto;
    gap: 4px 10px;
    align-items: baseline;
    padding: 9px 0;
    border-bottom: 1px dashed var(--line);
    font-family: 'JetBrains Mono', monospace;
    font-size: 13.5px;
    animation: land 0.35s ease;
  }
  @keyframes land { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .item-row .item-name { color: var(--ink); font-weight: 500; grid-column: 1 / 2; }
  .item-row .item-qty { color: var(--slate); font-size: 12px; grid-column: 1 / 2; margin-top: 2px; }
  .item-row .item-total { color: var(--ink); font-weight: 600; text-align: right; }
  .item-row .item-remove {
    grid-row: 1 / 3;
    background: none; border: none; width: auto; margin: 0; padding: 0 0 0 6px;
    color: #C8CAD6; font-size: 16px; cursor: pointer; line-height: 1;
  }
  .item-row .item-remove:hover { color: var(--chili); }

  .empty-state {
    text-align: center;
    padding: 40px 20px 30px;
    color: var(--slate);
  }
  .empty-state svg { margin-bottom: 14px; opacity: 0.55; }
  .empty-state p { font-size: 14px; }

  .error-msg {
    background: #FDECE7; color: var(--chili);
    border: 1px solid #F6C7B7;
    padding: 11px 14px; border-radius: 8px;
    margin: 0 26px 12px; font-size: 13px; font-weight: 500;
  }

  /* --- Totals / receipt tail --- */
  .totals { padding: 14px 26px 0; }
  .totals-row {
    display: flex; justify-content: space-between;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px; color: var(--slate);
    padding: 3px 0;
  }
  .grand-row {
    display: flex; justify-content: space-between;
    align-items: baseline;
    padding: 14px 0 20px;
    margin-top: 8px;
    border-top: 2px solid var(--ink);
    font-size: 22px; font-weight: 700; color: var(--ink);
  }
  .grand-row .amt { font-family: 'JetBrains Mono', monospace; }

  /* --- Action zone --- */
  .actions { padding: 0 26px 26px; }
  input[type="email"] {
    width: 100%; font-family: 'Space Grotesk', sans-serif;
    font-size: 14px; padding: 12px 14px;
    border: 1.5px solid var(--line); border-radius: 9px;
    outline: none; margin-bottom: 10px; color: var(--ink);
  }
  input[type="email"]:focus { border-color: var(--ink); }
  button {
    width: 100%; padding: 15px; font-family: 'Space Grotesk', sans-serif;
    font-size: 15px; font-weight: 600;
    border: none; border-radius: 10px; cursor: pointer;
    margin-top: 10px; transition: transform 0.08s ease, opacity 0.15s ease;
  }
  button:active { transform: scale(0.98); }
  button:disabled { opacity: 0.6; cursor: not-allowed; }
  .btn-pay { background: var(--chili); color: #fff; }
  .btn-pay:hover:not(:disabled) { opacity: 0.92; }
  .btn-ghost { background: transparent; color: var(--slate); border: 1.5px solid var(--line); }
  .btn-ghost:hover { border-color: var(--slate); color: var(--ink); }

  /* --- Success / torn receipt --- */
  .success-wrap { padding: 34px 26px 10px; text-align: center; }
  .success-mark {
    width: 52px; height: 52px; border-radius: 50%;
    background: var(--mint); color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-size: 26px; margin: 0 auto 14px;
  }
  .success-wrap h1 { font-size: 20px; margin-bottom: 4px; }
  .success-wrap .txn-id { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--slate); }
  .tear {
    height: 14px;
    background:
      linear-gradient(-45deg, transparent 8px, var(--paper) 0) 0 0,
      linear-gradient(45deg, transparent 8px, #1B2147 0) 0 0;
    background-size: 16px 16px; background-repeat: repeat-x;
    margin-top: 10px;
  }
  .email-note {
    font-size: 12.5px; color: var(--mint); font-weight: 500;
    padding-top: 10px;
  }

  .loading-dot {
    display: inline-block; width: 6px; height: 6px; border-radius: 50%;
    background: currentColor; margin-right: 5px;
    animation: pulse 1s ease-in-out infinite;
  }
  @keyframes pulse { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }

  button:focus-visible, input:focus-visible { outline: 2px solid var(--chili); outline-offset: 2px; }
</style>
</head>
<body>
<div id="root"></div>
{% verbatim %}
<script type="text/babel">
const { useState, useEffect, useRef } = React;

async function api(url, options = {}) {
  const headers = Object.assign({'Content-Type': 'application/json'}, options.headers || {});
  const res = await fetch(url, Object.assign({credentials: 'same-origin', headers}, options));
  return res.json();
}

function EmptyState() {
  return (
    <div className="empty-state">
      <svg width="56" height="40" viewBox="0 0 56 40" fill="none">
        <rect x="2" y="2" width="3" height="36" fill="#B7BAC9"/>
        <rect x="9" y="2" width="1.5" height="36" fill="#B7BAC9"/>
        <rect x="14" y="2" width="4" height="36" fill="#B7BAC9"/>
        <rect x="21" y="2" width="1.5" height="36" fill="#B7BAC9"/>
        <rect x="26" y="2" width="2.5" height="36" fill="#B7BAC9"/>
        <rect x="32" y="2" width="4" height="36" fill="#B7BAC9"/>
        <rect x="40" y="2" width="1.5" height="36" fill="#B7BAC9"/>
        <rect x="45" y="2" width="3" height="36" fill="#B7BAC9"/>
        <rect x="51" y="2" width="2" height="36" fill="#B7BAC9"/>
      </svg>
      <p>Scan an item to start your order.</p>
    </div>
  );
}

function App() {
  const [cart, setCart] = useState({items: [], subtotal: '0.00', gst_total: '0.00', grand_total: '0.00', error: null});
  const [email, setEmail] = useState('');
  const [barcode, setBarcode] = useState('');
  const [receipt, setReceipt] = useState(null);
  const [paying, setPaying] = useState(false);
  const inputRef = useRef(null);

  const refreshCart = async () => setCart(await api('/api/cart/'));
  useEffect(() => { refreshCart(); }, []);
  useEffect(() => { if (inputRef.current) inputRef.current.focus(); }, [cart, receipt]);

  const handleScan = async (e) => {
    e.preventDefault();
    if (!barcode.trim()) return;
    setCart(await api('/api/scan/', {method: 'POST', body: JSON.stringify({barcode})}));
    setBarcode('');
  };

  const handleRemove = async (bc) => setCart(await api('/api/remove/', {method: 'POST', body: JSON.stringify({barcode: bc})}));
  const handleClear = async () => setCart(await api('/api/clear/', {method: 'POST'}));

  const handlePay = async () => {
    setPaying(true);
    const order = await api('/payments/api/create-order/', {method: 'POST'});
    if (order.error) { alert(order.error); setPaying(false); return; }
    const rzp = new Razorpay({
      key: order.key_id, amount: order.amount, currency: 'INR',
      name: 'Self Checkout Store', description: 'Order Payment', order_id: order.order_id,
      handler: async (response) => {
        const result = await api('/payments/api/success/', {
          method: 'POST',
          body: JSON.stringify({razorpay_payment_id: response.razorpay_payment_id, email})
        });
        setReceipt(result);
        setPaying(false);
      },
      modal: { ondismiss: () => setPaying(false) },
      theme: { color: '#E8552C' }
    });
    rzp.open();
  };

  const startNewOrder = () => { setReceipt(null); setEmail(''); refreshCart(); };

  const Brand = () => (
    <div className="brand">
      <div className="mark">S</div>
      <div className="name">Self Checkout</div>
      <div className="tag">{receipt ? 'RECEIPT' : 'SCAN & PAY'}</div>
    </div>
  );

  if (receipt) {
    return (
      <div className="kiosk">
        <Brand />
        <div className="card">
          <div className="success-wrap">
            <div className="success-mark">✓</div>
            <h1>Payment complete</h1>
            <div className="txn-id">TXN #{String(receipt.transaction_id).padStart(6, '0')}</div>
          </div>
          <div className="tear"></div>
          <div className="receipt">
            {receipt.items.map((it, i) => (
              <div className="item-row" key={i}>
                <div className="item-name">{it.name}</div>
                <div className="item-qty">×{it.qty} · GST ₹{it.gst}</div>
                <div className="item-total">₹{it.price}</div>
                <span></span>
              </div>
            ))}
          </div>
          <div className="totals">
            <div className="totals-row"><span>Subtotal</span><span>₹{receipt.subtotal}</span></div>
            <div className="totals-row"><span>GST</span><span>₹{receipt.gst_total}</span></div>
            <div className="grand-row"><span>Total paid</span><span className="amt">₹{receipt.grand_total}</span></div>
          </div>
          <div className="actions" style={{paddingTop: 0}}>
            {receipt.email && <div className="email-note">📧 Receipt sent to {receipt.email}</div>}
            <button className="btn-pay" onClick={startNewOrder}>Start new order</button>
          </div>
        </div>
      </div>
    );
  }

  return (
    <div className="kiosk">
      <Brand />
      <div className="card">
        <div className="scan-zone">
          <div className="scan-label">Scan barcode</div>
          <form onSubmit={handleScan} className="scan-input-wrap">
            <input ref={inputRef} type="text" value={barcode} onChange={e => setBarcode(e.target.value)}
                   placeholder="0000 0000 00" autoFocus autoComplete="off" />
            <div className="scan-line"></div>
          </form>
        </div>

        {cart.error && <div className="error-msg">{cart.error}</div>}

        {cart.items.length > 0 ? (
          <React.Fragment>
            <div className="receipt">
              <div className="receipt-title">Your cart · {cart.items.length} item{cart.items.length > 1 ? 's' : ''}</div>
              {cart.items.map((item, i) => (
                <div className="item-row" key={item.barcode}>
                  <div className="item-name">{item.name}</div>
                  <div className="item-qty">×{item.qty} · GST ₹{item.gst}</div>
                  <div className="item-total">₹{item.line_total}</div>
                  <button className="item-remove" onClick={() => handleRemove(item.barcode)} aria-label={`Remove one ${item.name}`}>−</button>
                </div>
              ))}
            </div>

            <div className="totals">
              <div className="totals-row"><span>Subtotal</span><span>₹{cart.subtotal}</span></div>
              <div className="totals-row"><span>GST</span><span>₹{cart.gst_total}</span></div>
              <div className="grand-row"><span>Total</span><span className="amt">₹{cart.grand_total}</span></div>
            </div>

            <div className="actions">
              <input type="email" value={email} onChange={e => setEmail(e.target.value)}
                     placeholder="Email for receipt (optional)" />
              <button className="btn-pay" onClick={handlePay} disabled={paying}>
                {paying ? (<span><span className="loading-dot"></span>Processing…</span>) : `Pay ₹${cart.grand_total}`}
              </button>
              <button className="btn-ghost" onClick={handleClear}>Clear cart</button>
            </div>
          </React.Fragment>
        ) : (
          <EmptyState />
        )}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
{% endverbatim %}
</body>
</html>
