<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Self Checkout</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<style>
  :root {
    --ink: #2B2118;
    --rust: #C17A5D;
    --rust-dark: #A9613F;
    --cream: #FAF2E7;
    --tan: #EDE0D0;
    --taupe: #8B8378;
    --line: #E6D9C7;
    --mint: #4E8577;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
  }
  html, body { overflow-x: hidden; }
  body {
    font-family: 'Inter', sans-serif;
    background: #151210;
    color: var(--ink);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 48px 20px calc(20px + env(safe-area-inset-bottom));
  }
  .kiosk { width: 100%; max-width: 460px; }

  .brand { display: flex; align-items: center; gap: 10px; color: #EFE6D8; margin-bottom: 16px; padding-left: 4px; }
  .brand .mark {
    width: 30px; height: 30px; background: var(--rust); border-radius: 8px;
    display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 15px; color: #fff;
  }
  .brand .name { font-weight: 600; font-size: 15px; }
  .brand .tag { font-size: 12px; color: #A79A85; margin-left: auto; }

  .card {
    background: var(--cream); border-radius: 26px; overflow: hidden;
    box-shadow: 0 24px 60px rgba(0,0,0,0.4);
    animation: cardIn 0.35s cubic-bezier(0.16, 1, 0.3, 1);
  }
  @keyframes cardIn { from { opacity: 0; transform: translateY(10px) scale(0.99); } to { opacity: 1; transform: none; } }

  .scan-zone { padding: 28px 28px 16px; }
  .scan-label {
    font-family: 'Lora', serif; font-weight: 700; font-size: 15px; color: var(--rust-dark);
    margin-bottom: 12px;
  }
  .scan-input-wrap { position: relative; }
  .scan-input-wrap input {
    width: 100%; font-family: 'Inter', sans-serif; font-size: 16px;
    padding: 16px 20px; border: none; border-radius: 999px;
    outline: none; background: var(--tan); color: var(--ink);
  }
  .scan-input-wrap input::placeholder { color: #A79A85; }
  .scan-input-wrap input:focus { box-shadow: 0 0 0 2px var(--rust); }
  .scan-line {
    position: absolute; left: 20px; right: 20px; top: 4px; height: 2px; background: var(--rust);
    opacity: 0; pointer-events: none; border-radius: 2px;
  }
  .scan-input-wrap input:focus ~ .scan-line { animation: sweep 1.6s ease-in-out infinite; }
  @keyframes sweep {
    0% { top: 6px; opacity: 0.8; } 50% { top: calc(100% - 8px); opacity: 0.8; }
    51% { opacity: 0; } 100% { top: 6px; opacity: 0; }
  }

  .receipt { padding: 10px 28px 4px; max-height: 42vh; overflow-y: auto; }
  .item-row {
    display: flex; align-items: center; gap: 14px;
    padding: 12px 0; border-bottom: 1px solid var(--line);
    animation: land 0.35s ease;
  }
  @keyframes land { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .item-icon {
    width: 42px; height: 42px; border-radius: 12px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; font-size: 20px;
    background: var(--tan);
  }
  .item-info { flex: 1; min-width: 0; }
  .item-name { font-family: 'Lora', serif; font-weight: 700; font-size: 15px; color: var(--ink); }
  .item-meta { font-size: 12.5px; color: var(--taupe); margin-top: 2px; }
  .item-price { font-weight: 700; font-size: 15px; color: var(--ink); white-space: nowrap; }
  .item-btns { display: flex; gap: 6px; margin-left: 6px; }
  .icon-btn {
    width: 34px; height: 34px; border-radius: 10px; border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center; font-size: 16px;
    margin: 0; padding: 0; transition: transform 0.08s ease;
  }
  .icon-btn:active { transform: scale(0.92); }
  .btn-minus { background: var(--tan); color: var(--ink); }
  .btn-remove { background: #F7DAD3; color: #C0392B; }

  .empty-state { text-align: center; padding: 44px 24px 34px; color: var(--taupe); }
  .empty-state svg { margin-bottom: 14px; opacity: 0.5; }
  .empty-state p { font-size: 14px; }

  .error-msg {
    background: #F7DAD3; color: #A9382A; padding: 12px 16px; border-radius: 12px;
    margin: 0 28px 12px; font-size: 13px; font-weight: 500; animation: shake 0.4s ease;
  }
  @keyframes shake { 20%, 60% { transform: translateX(-4px); } 40%, 80% { transform: translateX(4px); } }

  .totals { padding: 16px 28px 0; }
  .totals-row { display: flex; justify-content: space-between; font-size: 13.5px; color: var(--taupe); padding: 4px 0; }
  .grand-row {
    display: flex; justify-content: space-between; align-items: baseline;
    padding: 16px 0 22px; margin-top: 8px; border-top: 1px solid var(--line);
  }
  .grand-row .label { font-family: 'Lora', serif; font-weight: 700; font-size: 22px; color: var(--ink); }
  .grand-row .amt { font-family: 'Lora', serif; font-weight: 700; font-size: 26px; color: var(--ink); }

  .actions { padding: 0 28px 28px; }
  input[type="email"] {
    width: 100%; font-family: 'Inter', sans-serif; font-size: 16px; padding: 14px 18px;
    border: 1px solid var(--line); border-radius: 999px; outline: none; margin-bottom: 12px;
    color: var(--ink); background: #fff;
  }
  input[type="email"]:focus { box-shadow: 0 0 0 2px var(--rust); }
  button.wide {
    width: 100%; padding: 17px; font-family: 'Inter', sans-serif; font-size: 16px; font-weight: 700;
    border: none; border-radius: 999px; cursor: pointer; margin-top: 10px;
    transition: transform 0.08s ease, opacity 0.15s ease; min-height: 52px;
  }
  button.wide:active { transform: scale(0.98); }
  button.wide:disabled { opacity: 0.6; cursor: not-allowed; }
  .btn-pay { background: var(--rust); color: #fff; box-shadow: 0 8px 20px rgba(193,122,93,0.35); }
  .btn-pay:hover:not(:disabled) { background: var(--rust-dark); }
  .btn-ghost { background: transparent; color: var(--taupe); border: 1px solid var(--line); }
  .btn-ghost:hover { border-color: var(--taupe); color: var(--ink); }

  .success-wrap { padding: 38px 28px 12px; text-align: center; }
  .success-mark {
    width: 54px; height: 54px; border-radius: 50%; background: var(--mint); color: #fff;
    display: flex; align-items: center; justify-content: center; font-size: 26px; margin: 0 auto 16px;
    animation: pop 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  @keyframes pop { from { transform: scale(0); } to { transform: scale(1); } }
  .success-wrap h1 { font-family: 'Lora', serif; font-size: 22px; margin-bottom: 6px; color: var(--ink); }
  .success-wrap .txn-id { font-size: 12.5px; color: var(--taupe); }
  .tear {
    height: 14px;
    background: linear-gradient(-45deg, transparent 8px, var(--cream) 0) 0 0, linear-gradient(45deg, transparent 8px, #151210 0) 0 0;
    background-size: 16px 16px; background-repeat: repeat-x; margin-top: 12px;
  }
  .email-note { font-size: 13px; color: var(--mint); font-weight: 600; padding-top: 4px; }

  .loading-dot {
    display: inline-block; width: 6px; height: 6px; border-radius: 50%;
    background: currentColor; margin-right: 5px; animation: pulse 1s ease-in-out infinite;
  }
  @keyframes pulse { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }

  .view-enter { animation: viewIn 0.28s ease; }
  @keyframes viewIn { from { opacity: 0; transform: translateX(8px); } to { opacity: 1; transform: none; } }

  button:focus-visible, input:focus-visible { outline: 2px solid var(--rust); outline-offset: 2px; }

  @media (max-width: 480px) {
    body { padding: 20px 12px calc(12px + env(safe-area-inset-bottom)); align-items: flex-start; }
    .kiosk { max-width: 100%; }
    .receipt { max-height: 38vh; }
    .actions.sticky-mobile {
      position: sticky; bottom: 0; background: var(--cream);
      margin: 0 -28px; padding: 16px 28px calc(16px + env(safe-area-inset-bottom));
      box-shadow: 0 -8px 16px rgba(0,0,0,0.06);
    }
  }
</style>
</head>
<body>
<div id="root"></div>
{% verbatim %}
<script type="text/babel">
const { useState, useEffect, useRef } = React;

async function api(url, options = {}) {
  const headers = Object.assign({'Content-Type': 'application/json'}, options.headers || {});
  const res = await fetch(url, Object.assign({credentials: 'same-origin', headers}, options));
  return res.json();
}

const ICONS = [
  { match: ['milk', 'dairy'], icon: '🥛' },
  { match: ['biscuit', 'cookie'], icon: '🍪' },
  { match: ['bread'], icon: '🍞' },
  { match: ['egg'], icon: '🥚' },
  { match: ['rice'], icon: '🍚' },
  { match: ['oil'], icon: '🛢️' },
  { match: ['tea', 'chai'], icon: '🍵' },
  { match: ['coffee'], icon: '☕' },
  { match: ['soap', 'wash'], icon: '🧼' },
  { match: ['chocolate', 'choco'], icon: '🍫' },
  { match: ['water'], icon: '💧' },
  { match: ['fruit', 'apple', 'banana'], icon: '🍎' },
  { match: ['vegetable', 'veg'], icon: '🥦' },
  { match: ['snack', 'chips'], icon: '🍿' },
];
function iconFor(name) {
  const n = name.toLowerCase();
  for (const entry of ICONS) if (entry.match.some(m => n.includes(m))) return entry.icon;
  return '🛒';
}

function EmptyState() {
  return (
    <div className="empty-state">
      <svg width="52" height="52" viewBox="0 0 52 52" fill="none">
        <circle cx="26" cy="26" r="24" stroke="#C9BBA5" strokeWidth="2"/>
        <path d="M17 20h18l-2 14H19l-2-14z" stroke="#C9BBA5" strokeWidth="2" strokeLinejoin="round"/>
        <path d="M20 20v-3a6 6 0 0112 0v3" stroke="#C9BBA5" strokeWidth="2"/>
      </svg>
      <p>Scan an item to start your order.</p>
    </div>
  );
}

function App() {
  const [cart, setCart] = useState({items: [], subtotal: '0.00', gst_total: '0.00', grand_total: '0.00', error: null});
  const [email, setEmail] = useState('');
  const [barcode, setBarcode] = useState('');
  const [receipt, setReceipt] = useState(null);
  const [paying, setPaying] = useState(false);
  const inputRef = useRef(null);

  const refreshCart = async () => setCart(await api('/api/cart/'));
  useEffect(() => { refreshCart(); }, []);
  useEffect(() => { if (inputRef.current) inputRef.current.focus(); }, [cart, receipt]);

  const handleScan = async (e) => {
    e.preventDefault();
    if (!barcode.trim()) return;
    setCart(await api('/api/scan/', {method: 'POST', body: JSON.stringify({barcode})}));
    setBarcode('');
  };

  const handleRemoveOne = async (bc) => setCart(await api('/api/remove/', {method: 'POST', body: JSON.stringify({barcode: bc})}));
  const handleRemoveAll = async (bc, qty) => {
    let c = cart;
    for (let i = 0; i < qty; i++) {
      c = await api('/api/remove/', {method: 'POST', body: JSON.stringify({barcode: bc})});
    }
    setCart(c);
  };
  const handleClear = async () => setCart(await api('/api/clear/', {method: 'POST'}));

  const handlePay = async () => {
    setPaying(true);
    const order = await api('/payments/api/create-order/', {method: 'POST'});
    if (order.error) { alert(order.error); setPaying(false); return; }
    const rzp = new Razorpay({
      key: order.key_id, amount: order.amount, currency: 'INR',
      name: 'Self Checkout Store', description: 'Order Payment', order_id: order.order_id,
      handler: async (response) => {
        const result = await api('/payments/api/success/', {
          method: 'POST',
          body: JSON.stringify({razorpay_payment_id: response.razorpay_payment_id, email})
        });
        setReceipt(result);
        setPaying(false);
      },
      modal: { ondismiss: () => setPaying(false) },
      theme: { color: '#C17A5D' }
    });
    rzp.open();
  };

  const startNewOrder = () => { setReceipt(null); setEmail(''); refreshCart(); };

  const Brand = () => (
    <div className="brand">
      <div className="mark">S</div>
      <div className="name">Self Checkout</div>
      <div className="tag">{receipt ? 'RECEIPT' : 'SCAN & PAY'}</div>
    </div>
  );

  if (receipt) {
    return (
      <div className="kiosk">
        <Brand />
        <div className="card view-enter">
          <div className="success-wrap">
            <div className="success-mark">✓</div>
            <h1>Payment complete</h1>
            <div className="txn-id">TXN #{String(receipt.transaction_id).padStart(6, '0')}</div>
          </div>
          <div className="tear"></div>
          <div className="receipt">
            {receipt.items.map((it, i) => (
              <div className="item-row" key={i}>
                <div className="item-icon">{iconFor(it.name)}</div>
                <div className="item-info">
                  <div className="item-name">{it.name}</div>
                  <div className="item-meta">×{it.qty} · GST ₹{it.gst}</div>
                </div>
                <div className="item-price">₹{it.price}</div>
              </div>
            ))}
          </div>
          <div className="totals">
            <div className="totals-row"><span>Subtotal</span><span>₹{receipt.subtotal}</span></div>
            <div className="totals-row"><span>GST</span><span>₹{receipt.gst_total}</span></div>
            <div className="grand-row"><span className="label">Total paid</span><span className="amt">₹{receipt.grand_total}</span></div>
          </div>
          <div className="actions" style={{paddingTop: 0}}>
            {receipt.email && <div className="email-note">📧 Receipt sent to {receipt.email}</div>}
            <button className="wide btn-pay" onClick={startNewOrder}>Start new order</button>
          </div>
        </div>
      </div>
    );
  }

  return (
    <div className="kiosk">
      <Brand />
      <div className="card view-enter">
        <div className="scan-zone">
          <div className="scan-label">Scan your item</div>
          <form onSubmit={handleScan} className="scan-input-wrap">
            <input ref={inputRef} type="text" value={barcode} onChange={e => setBarcode(e.target.value)}
                   placeholder="Scan or enter code" autoFocus autoComplete="off" inputMode="numeric" />
            <div className="scan-line"></div>
          </form>
        </div>

        {cart.error && <div className="error-msg">{cart.error}</div>}

        {cart.items.length > 0 ? (
          <React.Fragment>
            <div className="receipt">
              {cart.items.map((item) => (
                <div className="item-row" key={item.barcode}>
                  <div className="item-icon">{iconFor(item.name)}</div>
                  <div className="item-info">
                    <div className="item-name">{item.name}</div>
                    <div className="item-meta">×{item.qty} · GST ₹{item.gst}</div>
                  </div>
                  <div className="item-price">₹{item.line_total}</div>
                  <div className="item-btns">
                    <button className="icon-btn btn-minus" onClick={() => handleRemoveOne(item.barcode)} aria-label={`Remove one ${item.name}`}>−</button>
                    <button className="icon-btn btn-remove" onClick={() => handleRemoveAll(item.barcode, item.qty)} aria-label={`Remove all ${item.name}`}>✕</button>
                  </div>
                </div>
              ))}
            </div>

            <div className="totals">
              <div className="totals-row"><span>Subtotal</span><span>₹{cart.subtotal}</span></div>
              <div className="totals-row"><span>GST</span><span>₹{cart.gst_total}</span></div>
              <div className="grand-row"><span className="label">Total</span><span className="amt">₹{cart.grand_total}</span></div>
            </div>

            <div className="actions sticky-mobile">
              <input type="email" value={email} onChange={e => setEmail(e.target.value)}
                     placeholder="Email for receipt (optional)" />
              <button className="wide btn-pay" onClick={handlePay} disabled={paying}>
                {paying ? (<span><span className="loading-dot"></span>Processing…</span>) : `Pay ₹${cart.grand_total}`}
              </button>
              <button className="wide btn-ghost" onClick={handleClear}>Clear cart</button>
            </div>
          </React.Fragment>
        ) : (
          <EmptyState />
        )}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
{% endverbatim %}
</body>
</html>
